<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Resource Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Modern CSS Custom Properties (Theme Variables) */
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-color: #3b82f6;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --card-hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --badge-bg: #eff6ff;
            --badge-text: #1d4ed8;
            --input-bg: #ffffff;
            --modal-overlay: rgba(15, 23, 42, 0.5);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-speed: 0.2s;
        }

        /* Dark Mode Theme Overrides */
        body.dark-theme {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #60a5fa;
            --accent-color: #60a5fa;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --card-hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --badge-bg: #1e3a8a;
            --badge-text: #93c5fd;
            --input-bg: #0f172a;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        /* Base Resets & Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Header Layout */
        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .logo i {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Common Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            font-weight: 5rem;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-speed) ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background-color: var(--border-color);
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-color);
        }

        /* Main Container */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search & Filter Controls */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* Resource Grid Layout */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Resource Card Component */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--card-hover-shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .upvote-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .upvote-btn:hover {
            background-color: var(--border-color);
            color: var(--primary-color);
        }

        .upvote-btn.voted {
            background-color: var(--badge-bg);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .card-link {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card-link:hover {
            text-decoration: underline;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--border-color);
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed) ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        /* Footer */
        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: auto;
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            .hero h1 {
                font-size: 1.75rem;
            }
            .controls-section {
                gap: 1rem;
            }
            .nav-container {
                padding: 0.75rem 1rem;
            }
            .modal-content {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-code"></i>
                <span>Resource Hub</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="openModalBtn">
                    <i class="fa-solid fa-plus"></i> Add Resource
                </button>
                <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <h1>Developer Resource Hub</h1>
            <p>Discover, search, and share the best tools, libraries, and learning resources for modern software development.</p>
        </section>

        <!-- Search and Category Filters -->
        <section class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search resources by title or keyword...">
            </div>
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Web Dev">Web Dev</button>
                <button class="filter-btn" data-category="App Dev">App Dev</button>
                <button class="filter-btn" data-category="AI/ML">AI/ML</button>
                <button class="filter-btn" data-category="Tools">Tools</button>
            </div>
        </section>

        <!-- Dynamic Card Grid Container -->
        <section class="resource-grid" id="resourceGrid">
            <!-- Cards will be populated dynamically via JavaScript -->
        </section>
    </main>

    <!-- Add Resource Modal Dialog -->
    <div class="modal-overlay" id="resourceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Submit a Resource</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="resourceForm">
                <div class="form-group">
                    <label for="title">Resource Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., Tailwind CSS" required>
                </div>
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" class="form-control" required>
                        <option value="">Select Category</option>
                        <option value="Web Dev">Web Dev</option>
                        <option value="App Dev">App Dev</option>
                        <option value="AI/ML">AI/ML</option>
                        <option value="Tools">Tools</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="url">Resource URL *</label>
                    <input type="url" id="url" class="form-control" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="description">Short Description *</label>
                    <textarea id="description" class="form-control" placeholder="Brief explanation of why this resource is useful..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Resource</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Developer Resource Hub &bull; Built with HTML, CSS & Vanilla JavaScript</p>
    </footer>

    <script>
        // Initial Default Sample Resources Data
        const initialResources = [
            {
                id: 1,
                title: "MDN Web Docs",
                category: "Web Dev",
                description: "The official repository of web standards and documentation for HTML, CSS, and JavaScript.",
                url: "https://developer.mozilla.org",
                upvotes: 42
            },
            {
                id: 2,
                title: "Flutter Framework",
                category: "App Dev",
                description: "Google's UI toolkit for building beautiful, natively compiled applications for mobile from a single codebase.",
                url: "https://flutter.dev",
                upvotes: 28
            },
            {
                id: 3,
                title: "Hugging Face",
                category: "AI/ML",
                description: "The AI community platform providing pre-trained machine learning models, datasets, and API tools.",
                url: "https://huggingface.co",
                upvotes: 55
            },
            {
                id: 4,
                title: "GitHub CLI",
                category: "Tools",
                description: "Take GitHub to the command line! Manage pull requests, issues, and workflow repositories directly.",
                url: "https://cli.github.com",
                upvotes: 19
            },
            {
                id: 5,
                title: "Tailwind CSS",
                category: "Web Dev",
                description: "A utility-first CSS framework packed with classes that can be composed to build any custom design.",
                url: "https://tailwindcss.com",
                upvotes: 38
            }
        ];

        // State Management
        let resources = JSON.parse(localStorage.getItem('dev_resources')) || initialResources;
        let activeCategory = 'All';
        let searchQuery = '';

        // DOM Element References
        const resourceGrid = document.getElementById('resourceGrid');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        
        // Modal Element References
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const resourceModal = document.getElementById('resourceModal');
        const resourceForm = document.getElementById('resourceForm');

        // Function: Render Resource Cards to the DOM
        function renderResources() {
            resourceGrid.innerHTML = '';

            // Filter logic by category and search keyword
            const filtered = resources.filter(res => {
                const matchesCategory = activeCategory === 'All' || res.category === activeCategory;
                const matchesSearch = res.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      res.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            // Display Empty State if no resources match filters
            if (filtered.length === 0) {
                resourceGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3>No resources found</h3>
                        <p>Try clearing your search or filter options.</p>
                    </div>
                `;
                return;
            }

            // Generate HTML for each resource card
            filtered.forEach(res => {
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h3 class="card-title">${escapeHTML(res.title)}</h3>
                            <span class="card-badge">${escapeHTML(res.category)}</span>
                        </div>
                        <p class="card-description">${escapeHTML(res.description)}</p>
                    </div>
                    <div class="card-footer">
                        <button class="upvote-btn" onclick="handleUpvote(${res.id})">
                            <i class="fa-solid fa-caret-up"></i> ${res.upvotes}
                        </button>
                        <a href="${escapeHTML(res.url)}" target="_blank" rel="noopener noreferrer" class="card-link">
                            Visit <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
                resourceGrid.appendChild(card);
            });
        }

        // Helper: Prevent XSS Security Vulnerabilities
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Function: Handle Upvotes
        window.handleUpvote = function(id) {
            resources = resources.map(res => {
                if (res.id === id) {
                    return { ...res, upvotes: res.upvotes + 1 };
                }
                return res;
            });
            saveAndRender();
        };

        // Function: Save State to LocalStorage and Trigger Rerender
        function saveAndRender() {
            localStorage.setItem('dev_resources', JSON.stringify(resources));
            renderResources();
        }

        // Search Input Event Listener
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResources();
        });

        // Category Filter Buttons Event Listener
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.getAttribute('data-category');
                renderResources();
            });
        });

        // Theme Toggle Setup (Dark/Light Mode)
        const currentTheme = localStorage.getItem('app_theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeIcon.className = 'fa-solid fa-sun';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
        });

        // Modal Functionality
        function toggleModal(show) {
            if (show) {
                resourceModal.classList.add('active');
            } else {
                resourceModal.classList.remove('active');
                resourceForm.reset();
            }
        }

        openModalBtn.addEventListener('click', () => toggleModal(true));
        closeModalBtn.addEventListener('click', () => toggleModal(false));
        cancelModalBtn.addEventListener('click', () => toggleModal(false));

        // Form Submit Handler
        resourceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newResource = {
                id: Date.now(),
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                url: document.getElementById('url').value.trim(),
                description: document.getElementById('description').value.trim(),
                upvotes: 1
            };

            resources.unshift(newResource);
            saveAndRender();
            toggleModal(false);
        });

        // Initialize App on Page Load
        renderResources();
    </script>
</body>
</html>
